name: "paperbanana-figure-generation"
description: "Native PaperBanana figure generation: plan, human-approve, generate via matplotlib/TikZ, critique against the 8 veto rules, and conditionally refine. No packaged tool — figures are produced by the figure-designer agent (bash + matplotlib) and gated by a fresh figure-critic."
version: "2.0.0"
tags: ["figures", "paperbanana", "scientific-paper", "quality-validation", "multi-stage", "native"]

# Input context required for recipe execution
context:
  paper_content: ""           # Required: paper text for context extraction
  figure_type: "methodology"  # Options: methodology, plot, architecture
  conference: "neurips"       # Target venue for style guidelines
  output_dir: "figures"       # Where generated figures are written

# Staged recipe with a human approval gate on the plan, then generate -> critique -> refine.
stages:
  # ============================================================
  # Stage 1: PLANNING  (Retriever + Planner + Stylist)
  # Extract context and plan content + style; human approves before any generation.
  # ============================================================
  - name: planning
    description: "Extract paper context and plan figure content + style"
    approval_required: true
    approval_prompt: |
      📋 **Figure Plan Review**

      {{figure_plan}}

      **Context extracted:**
      {{paper_context}}

      ✅ Approve to proceed with generation
      ❌ Deny to revise the plan

    steps:
      - id: extract-context
        agent: research:figure-designer
        prompt: |
          Extract the context needed to design a {{figure_type}} figure from this paper:

          ```
          {{paper_content}}
          ```

          Identify and summarize:
          1. The key concepts/relationships to visualize
          2. Relevant sections and technical details
          3. Target audience expertise level
          4. Critical terminology and notation (must match the figure)
          5. Any comparisons/baselines to illustrate

          Provide a focused summary suitable for figure planning.
        output: paper_context
        timeout: 300

      - id: plan-figure
        agent: research:figure-designer
        prompt: |
          Plan a {{figure_type}} figure for a {{conference}} submission.

          **Paper context:**
          {{paper_context}}

          Produce a concrete, buildable plan covering:
          1. **Message** — the single thing the figure must convey.
          2. **Content** — the elements/panels (cap at ~8 for clarity) and their relationships.
          3. **Style** — {{conference}} sizing (figsize in inches), a colorblind-safe palette,
             font sizes (>= 8pt at final size), and the output format (vector PDF + TikZ where practical).
          4. **Layout** — horizontal pipeline / vertical stack / grid, and the visual hierarchy.

          This plan goes to a human for approval, so make it clear and specific.
        output: figure_plan
        timeout: 300
        depends_on: [extract-context]

  # ============================================================
  # Stage 2: GENERATION  (Visualizer + Critic)
  # The agent writes and runs the figure code itself, then a fresh critic vetoes it.
  # ============================================================
  - name: generation
    description: "Generate the figure directly (matplotlib/seaborn/TikZ) and critique it"
    steps:
      - id: generate-figure
        agent: research:figure-designer
        prompt: |
          Generate the {{figure_type}} figure for {{conference}} by WRITING AND RUNNING the
          code yourself. Do NOT call any external figure tool — you are the visualizer.

          **Approved plan:**
          {{figure_plan}}

          **Context:**
          {{paper_context}}

          Procedure:
          1. Ensure dependencies via bash: `pip install -q matplotlib numpy scienceplots` (add
             `seaborn` for statistical plots). If pip is restricted, use `uv pip install` or a venv.
          2. Write the generating script under `{{output_dir}}/` and run it with python.
          3. Save BOTH a vector **PDF** and, where practical, a **TikZ** (`.tex`) file. Apply
             {{conference}} sizing (correct figsize), a colorblind-safe palette, white background,
             >= 8pt text, labeled axes with units, and honest data (error bars on means, no
             misleading truncation).
          4. Self-check against the 8 PaperBanana veto rules before reporting.

          Report: the absolute file path(s) AND the full final source code, so the critic can
          verify font sizes, colors, and data integrity from the source.
        output: generation_result
        timeout: 900
        on_error: fail   # Critical step — must succeed

      - id: critique-figure
        agent: research:figure-critic
        prompt: |
          Critique the generated figure against the 8 PaperBanana veto rules.

          Venue: {{conference}} · Figure type: {{figure_type}}

          **Generated (paths + source):**
          {{generation_result}}

          **Plan it should satisfy:**
          {{figure_plan}}

          Inspect the file(s) and read the source. Return ONLY the JSON verdict defined in your
          instructions (quality_passed, severity, failed_rules, issues, suggestions, compliant_checks).
        output: quality_check
        parse_json: true
        timeout: 300
        depends_on: [generate-figure]

  # ============================================================
  # Stage 3: REFINEMENT
  # Runs only when the critic vetoed the figure (major/critical). One refine pass, re-critiqued.
  # ============================================================
  - name: refinement
    description: "Refine if the critic vetoed the figure, then re-critique"
    steps:
      - id: refine-figure
        agent: research:figure-designer
        prompt: |
          The critic vetoed the figure. Fix EVERY issue by editing and re-running your own
          source — no external tool.

          **Failed rules:** {{quality_check.failed_rules}}
          **Issues:** {{quality_check.issues}}
          **Suggestions:** {{quality_check.suggestions}}

          **Original (paths + source):**
          {{generation_result}}

          Preserve what worked; address only the failures; re-save the PDF/TikZ under
          `{{output_dir}}/`. Report the new absolute path(s) AND the full updated source.
        output: refined_result
        timeout: 900
        condition: "{{quality_check.severity}} == 'major' or {{quality_check.severity}} == 'critical'"
        on_error: continue   # If refinement fails, the user can review the original

      - id: critique-refinement
        agent: research:figure-critic
        prompt: |
          Re-critique the refined figure against the 8 veto rules.

          Venue: {{conference}} · Figure type: {{figure_type}}

          **Refined (paths + source):**
          {{refined_result}}

          **Originally failed:** {{quality_check.failed_rules}}

          Return ONLY the JSON verdict defined in your instructions.
        output: final_quality_check
        parse_json: true
        timeout: 300
        condition: "{{quality_check.severity}} == 'major' or {{quality_check.severity}} == 'critical'"
        depends_on: [refine-figure]
        on_error: continue

# Recursion protection: bound total work
recursion:
  max_depth: 2
  max_total_steps: 25
